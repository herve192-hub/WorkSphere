name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml

  containers:
    name: Browser regression
    uses: ./.github/workflows/container-ci.yml

  security:
    name: Security
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security-ci.yml

  required:
    name: Required CI checks
    if: ${{ always() }}
    needs: [backend, frontend, containers, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test and security workflow to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';

          const checks = JSON.parse(process.env.CHECK_RESULTS);
          const failed = Object.entries(checks).filter(([, check]) => check.result !== 'success');
          for (const [name, check] of Object.entries(checks)) console.log(`${name}: ${check.result}`);

          const runUrl = process.env.CI_RUN_URL;
          const summary = [
            '## Required CI checks', '',
            '| Workflow | Result |', '| --- | --- |',
            ...Object.entries(checks).map(([name, check]) => `| ${name} | ${check.result} |`),
          ];
          if (failed.length) {
            const reason = `CI blocked by: ${failed.map(([name, check]) => `${name} (${check.result})`).join(', ')}.`;
            console.error(reason);
            summary.push('', reason);
            if (checks.security?.result !== 'success') {
              const guidance = 'Open the failed Security jobs for the underlying scanner errors. Review dependency-audit-backend/frontend, configuration-scan-reports, image-scan-api/web/mongo, codeql-reports, and secret-scan-reports artifacts when available.';
              console.error(guidance);
              summary.push('', guidance);
            }
            console.error(`Jobs and scan reports: ${runUrl}`);
            summary.push('', `[Open jobs](${runUrl}) · [Open artifacts](${runUrl}#artifacts)`);
            process.exitCode = 1;
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          }
          JS
