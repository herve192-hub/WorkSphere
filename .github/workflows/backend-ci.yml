name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "back-end/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "back-end/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The current backend package.json has no real automated test suite yet.
      # Until Jest/Supertest tests are added, validate that every JavaScript
      # source file can at least be parsed successfully by Node.
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(
            find . -type f -name "*.js"               -not -path "./node_modules/*"               -print0
          )

      - name: Verify application entry point exists
        run: test -f server.js
