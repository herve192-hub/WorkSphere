name: Container CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: Production container smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Verify isolated production containers and security headers
        run: bash .github/scripts/verify-containers.sh

  containers:
    name: Playwright end-to-end and regression (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: "true"
      WORKSPHERE_E2E_BROWSER: ${{ matrix.browser }}
      WORKSPHERE_E2E_RUNNER: container
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        timeout-minutes: 5
        working-directory: frontend
        run: npm ci --no-audit
      - name: Pull the pinned browser image with preinstalled system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/run-browser-tests.sh --prepare
      - name: Verify isolated containers and run browser regressions
        run: bash .github/scripts/verify-containers.sh --browser-tests
      - name: Upload browser report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-${{ matrix.browser }}-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
