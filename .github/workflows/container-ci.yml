name: Container CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".nvmrc"
      - ".github/scripts/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".nvmrc"
      - ".github/scripts/**"
      - ".github/workflows/container-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Verify Containers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images and verify Compose stack
        run: bash .github/scripts/verify-containers.sh
