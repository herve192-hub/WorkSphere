services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - worksphere-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status(); } catch (e) { if (e.codeName !== 'NotYetInitialized') throw e; rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/worksphere?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:3000
      NODE_ENV: development
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  web:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000/api/v1
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  worksphere-data:
